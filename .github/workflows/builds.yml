name: "Desktop builds"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  QT_VERSION: "6.9.3"
  VCPKG_REF: "2026.06.24"

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          cache: true

      - name: Install WebRTC build tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install nasm

      - name: Cache vcpkg binaries
        id: cache_vcpkg_binaries_macos
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Bootstrap vcpkg
        run: |
          rm -rf "$RUNNER_TEMP/vcpkg"
          git clone --branch "$VCPKG_REF" --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build and package
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "vcpkg binary cache hit: ${{ steps.cache_vcpkg_binaries_macos.outputs.cache-hit }}"
          cmake --preset macos-debug
          cmake --build --preset macos-debug
          bash scripts/package-macos.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TinyMeshChat-macOS
          path: dist/TinyMeshChat-macOS.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP/vcpkg") {
            Remove-Item -LiteralPath "$env:RUNNER_TEMP/vcpkg" -Recurse -Force
          }
          git clone --branch $env:VCPKG_REF --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Build and package
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          cmake --preset windows-debug
          cmake --build --preset windows-debug
          .\scripts\package-windows.ps1

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: TinyMeshChat-Windows-x64
          path: dist/TinyMeshChat.zip
          if-no-files-found: error
