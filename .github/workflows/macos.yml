name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          cache: true

      - name: Cache vcpkg tool
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ runner.arch }}-2026.06.24

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-2026.06.24-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-2026.06.24-

      - name: Bootstrap vcpkg
        run: |
          if [[ ! -x "$RUNNER_TEMP/vcpkg/vcpkg" ]]; then
            rm -rf "$RUNNER_TEMP/vcpkg"
            git clone --branch 2026.06.24 --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Build and package
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          export PATH="$(brew --prefix ninja)/bin:$PATH"
          bash scripts/build-macos.sh macos-release

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TinyMeshChat-macOS
          path: dist/TinyMeshChat-macOS.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg tool
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ runner.arch }}-2026.06.24

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-2026.06.24-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-2026.06.24-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/vcpkg/vcpkg.exe")) {
            if (Test-Path -LiteralPath "$env:RUNNER_TEMP/vcpkg") {
              Remove-Item -LiteralPath "$env:RUNNER_TEMP/vcpkg" -Recurse -Force
            }
            git clone --branch 2026.06.24 --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
            & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: Build and package
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
        run: .\scripts\package-windows.ps1 windows-release

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: TinyMeshChat-Windows-x64
          path: dist/TinyMeshChat.zip
          if-no-files-found: error
