name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools and Qt
        run: brew install ninja qt@6

      - name: Bootstrap vcpkg
        run: |
          git clone --branch 2026.06.24 --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build and package
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          QT_ROOT: /opt/homebrew/opt/qt@6
        run: |
          export PATH="$(brew --prefix ninja)/bin:$PATH"
          if [[ ! -d "$QT_ROOT" ]]; then
            export QT_ROOT="$(brew --prefix qt@6)"
          fi
          bash scripts/build-macos.sh macos-release

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TinyMeshChat-macOS
          path: dist/TinyMeshChat-macOS.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --branch 2026.06.24 --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Build and package
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: .\scripts\package-windows.ps1 windows-release

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: TinyMeshChat-Windows-x64
          path: dist/TinyMeshChat.zip
          if-no-files-found: error
