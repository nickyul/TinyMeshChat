name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools and Qt
        run: brew install ninja qt@6

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build and package
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          QT_ROOT: /opt/homebrew/opt/qt@6
        run: |
          if [[ ! -d "$QT_ROOT" ]]; then
            export QT_ROOT="$(brew --prefix qt@6)"
          fi
          bash scripts/build-macos.sh macos-release

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TinyMeshChat-macOS
          path: dist/TinyMeshChat-macOS.zip
          if-no-files-found: error
