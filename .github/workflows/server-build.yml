name: Linux signaling server

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: TinyMeshSignalingServer-Linux-x64

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_VERSION: "6.9.3"
      VCPKG_REF: "2026.06.24"
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool patchelf

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets
          cache: true

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-server-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-server-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Bootstrap vcpkg
        run: |
          git clone --branch "$VCPKG_REF" --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build and package server
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake --preset linux-server-release
          cmake --build --preset linux-server-release
          bash scripts/package-linux-server.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/TinyMeshSignalingServer-Linux-x64.tar.gz
          if-no-files-found: error
