name: "Desktop release"

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.9.3"
  VCPKG_REF: "2026.06.24"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --branch $env:VCPKG_REF --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Bootstrap Velopack SDK
        shell: pwsh
        run: .\scripts\bootstrap-velopack.ps1 -Destination "$env:RUNNER_TEMP/velopack"

      - name: Build and package
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
          TMC_ENABLE_UPDATER: "1"
          TMC_BUILD_VELOPACK: "1"
          TMC_VELOPACK_ROOT: ${{ runner.temp }}/velopack
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          .\scripts\package-windows.ps1

      - name: Upload Windows release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/velopack-win-x64/*
            dist/TinyMeshChat.zip
            dist/tmc-app-version.txt
          if-no-files-found: error

  build-macos:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          cache: true

      - name: Install build tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install nasm

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Bootstrap dependencies
        run: |
          git clone --branch "$VCPKG_REF" --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          bash scripts/bootstrap-velopack.sh "$RUNNER_TEMP/velopack"

      - name: Build and package
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
          TMC_ENABLE_UPDATER: "1"
          TMC_BUILD_VELOPACK: "1"
          TMC_VELOPACK_ROOT: ${{ runner.temp }}/velopack
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          bash scripts/package-macos.sh

      - name: Upload macOS release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/velopack-osx-arm64/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Download release inputs
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < release-assets/tmc-app-version.txt)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match v$version" >&2
            exit 1
          fi
          rm release-assets/tmc-app-version.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v${{ steps.version.outputs.version }}" \
            --jq .body > release-notes.md

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          if (( ${#release_files[@]} == 0 )); then
            echo "No release files found" >&2
            exit 1
          fi
          gh release create "v${{ steps.version.outputs.version }}" "${release_files[@]}" \
            --verify-tag \
            --title "TinyMesh Chat v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
